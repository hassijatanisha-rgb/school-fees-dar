<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitchly capture</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="result.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icons/icon48.png" alt="">Stitchly</div>
  <div class="meta" id="meta"></div>
  <div class="actions" id="actions" hidden>
    <div class="zoom" role="group" aria-label="Zoom">
      <button class="btn" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button class="btn" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
    <button class="btn primary" id="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>Download PNG</button>
    <button class="btn" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>
    <button class="btn" id="pdf" data-pro><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>PDF</button>
    <button class="btn" id="annotate" data-pro><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Annotate</button>
    <button class="btn pro" id="getpro" hidden>Get Pro</button>
    <a class="btn icon-only" href="options.html" target="_blank" title="Settings and licence" aria-label="Settings and licence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
</header>

<div class="toolbar" id="tools" hidden>
  <div class="group" role="radiogroup" aria-label="Annotation tool">
    <button class="btn tool active" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Box</button>
    <button class="btn tool" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5m0 0h-9m9 0v9"/></svg>Arrow</button>
    <button class="btn tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16m-3 0h6"/></svg>Text</button>
    <button class="btn tool" data-tool="blur" title="Pixelate (B)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="5" height="5"/><rect x="14" y="4" width="5" height="5" opacity=".5"/><rect x="9" y="9" width="5" height="5" opacity=".7"/><rect x="4" y="14" width="5" height="5" opacity=".4"/><rect x="14" y="14" width="5" height="5"/></svg>Blur</button>
  </div>
  <div class="group swatches" aria-label="Colour">
    <button class="swatch active" data-color="#e11d48" style="--c:#e11d48" title="Red" aria-label="Red"></button>
    <button class="swatch" data-color="#f59e0b" style="--c:#f59e0b" title="Amber" aria-label="Amber"></button>
    <button class="swatch" data-color="#2563eb" style="--c:#2563eb" title="Blue" aria-label="Blue"></button>
    <button class="swatch" data-color="#111827" style="--c:#111827" title="Black" aria-label="Black"></button>
  </div>
  <div class="group">
    <button class="btn" id="undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
    <button class="btn" id="done">Done</button>
  </div>
</div>

<main id="main">
  <div class="notice" id="notice" hidden></div>
  <div class="status" id="status">Stitching your capture…</div>
  <div id="parts"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="upsell">
  <form method="dialog">
    <div class="up-head"><span class="chip pro">PRO</span><h2>Unlock Stitchly Pro</h2></div>
    <p class="up-price"><strong>US$12</strong> one time. No subscription, no watermark, ever.</p>
    <ul>
      <li>Download as PDF</li>
      <li>Annotate: boxes, arrows, text and blur</li>
      <li>Capture a selected region (Alt+Shift+R)</li>
    </ul>
    <p class="muted" id="up-note"></p>
    <div class="up-actions">
      <button class="btn" value="cancel">Not now</button>
      <button class="btn" id="up-key" value="key" type="button">I have a key</button>
      <button class="btn primary" id="up-buy" value="buy" type="button">Get Pro</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="license.js"></script>
<script src="lib/jobs.js"></script>
<script src="lib/pdf.js"></script>
<script src="result.js"></script>
</body>
</html>
