<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New message – local demo page</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #eef0f6; color: #1f2333; }
  .caption { height: 92px; display: flex; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(135deg, #4f46e5, #8b5cf6); color: #fff; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .caption kbd { font: 700 24px ui-monospace, Menlo, monospace; background: rgba(255,255,255,.18); border-radius: 8px; padding: 2px 10px; }
  .caption.hidden { display: none; }
  .app { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 92px); }
  .app.full { height: 100vh; }
  nav { padding: 22px 16px; background: #f8f9fc; border-right: 1px solid #dfe2ec; }
  nav .new { background: #1f2333; color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; display: inline-block; margin-bottom: 18px; }
  nav div.item { padding: 7px 12px; border-radius: 8px; color: #555b74; }
  nav div.item.on { background: #e3e6f3; color: #1f2333; font-weight: 600; }
  main { padding: 26px 34px; }
  .compose { background: #fff; border-radius: 14px; box-shadow: 0 6px 28px rgba(30,35,70,.10); max-width: 860px; overflow: hidden; }
  .bar { background: #2b2f45; color: #fff; padding: 10px 16px; font-weight: 600; font-size: 14px; }
  .row { display: flex; align-items: center; border-bottom: 1px solid #eceef4; padding: 0 16px; }
  .row label { color: #7a7f98; width: 64px; font-size: 14px; }
  .row input { flex: 1; border: none; outline: none; font: inherit; padding: 11px 0; }
  #body { min-height: 360px; padding: 16px 18px; outline: none; white-space: pre-wrap; }
  .foot { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #eceef4; }
  .send { background: #4f46e5; color: #fff; border-radius: 999px; padding: 8px 22px; font-weight: 600; }
</style>
</head>
<body>
  <div class="caption" id="caption"></div>
  <div class="app">
    <nav>
      <div class="new">✎ Compose</div>
      <div class="item on">Inbox</div>
      <div class="item">Starred</div>
      <div class="item">Sent</div>
      <div class="item">Drafts</div>
    </nav>
    <main>
      <div class="compose">
        <div class="bar">New message</div>
        <div class="row"><label for="to">To</label><input id="to" type="email" autocomplete="off"></div>
        <div class="row"><label for="subject">Subject</label><input id="subject" type="text" autocomplete="off"></div>
        <div id="body" contenteditable="true" aria-label="Message body"></div>
        <div class="foot"><span class="send">Send</span></div>
      </div>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const cap = params.get('caption');
    const el = document.getElementById('caption');
    if (cap) el.innerHTML = cap; // local demo only: caption markup is supplied by the recording script
    else { el.classList.add('hidden'); document.querySelector('.app').classList.add('full'); }
    window.setCaption = (html) => { el.innerHTML = html; };
  </script>
</body>
</html>
